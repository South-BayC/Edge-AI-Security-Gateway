# Edge-AI-Gateway 开发用 MQTT broker 配置
# T11-②：用户名/密码认证
# T11-③：TLS（8883），证书由 cloud/gen_tls_certs.sh 生成
#
# 账号文件由 cloud/gen_mqtt_passwd.sh 生成（mosquitto_passwd）
listener 1883 0.0.0.0
allow_anonymous false
password_file secrets/mosquitto.passwd
persistence false
log_dest stdout

# ---- TLS 监听（单向认证：只校验服务器证书） ----
# cloudctl.sh 会先 cd 到 cloud/，因此这里用相对路径
listener 8883 0.0.0.0
cafile   certs/ca.crt
certfile certs/server.crt
keyfile  certs/server.key
tls_version tlsv1.2
require_certificate false
